<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf3fc" />
    <link

    />
    <title>AIP05 · 企业 AI 工作台</title>
    <style>
:root {
  --ink: #172747;
  --muted: #586b85;
  --accent: #205ec5;
  --accent-soft: #e7f0ff;
  --surface: #fff;
  --surface-soft: #f6f9fd;
  --line: #e2e7ef;
  --control-line: #7d8da4;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-12: 12px;
  --space-20: 20px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --success: #14704f;
  --success-bg: #eaf7f1;
  --warning: #8a5b10;
  --warning-bg: #fff5de;
  --danger: #b33542;
  --danger-bg: #fdf0f1;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  --shadow: 0 2px 8px #314d7608;
  --shadow-pop: 0 14px 48px #18335425;
  --space: 16px;
  --motion: 180ms;
  --body: 14px;
  --small: 12px;
  --title: 23px;
  --sidebar: 204px;
  --session: 238px;
  --viewer: 340px;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
  color: var(--ink);
  font-size: var(--body);
  font-variant-numeric: tabular-nums;
  background: #f2f5f9;
}
body {
  background: #f2f5f9;
  overflow: hidden;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button,
a {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  border: 0;
  background: none;
}
input,
select,
textarea {
  border: 1px solid var(--control-line);
  background: #fff;
  border-radius: var(--r-sm);
  padding: 8px 8px;
  min-width: 0;
}
textarea {
  resize: vertical;
}
input:focus,
textarea:focus,
select:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
button:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
button:hover {
  color: var(--accent);
}
button:active {
  transform: translateY(1px);
}
input::placeholder,
textarea::placeholder {
  color: var(--muted);
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: var(--title);
  font-weight: 650;
  letter-spacing: -0.4px;
}
h2 {
  font-size: 17px;
  font-weight: 650;
}
h3 {
  font-size: 15px;
  font-weight: 600;
}
p {
  line-height: 1.7;
}
small,
.muted {
  color: var(--muted);
  font-size: var(--small);
}
.ico {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.ico.sm {
  width: 15px;
  height: 15px;
}
.flex {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}
.between {
  justify-content: space-between;
}
.stack {
  display: grid;
  gap: var(--space-md);
}
.grow {
  flex: 1;
  min-width: 0;
}
.hidden {
  display: none !important;
}
.skip {
  position: fixed;
  left: 20px;
  top: -60px;
  background: #fff;
  padding: 12px;
  z-index: 100;
}
.skip:focus {
  top: 12px;
}
.app {
  height: 100dvh;
  padding: 12px;
  display: flex;
  gap: var(--space-sm);
}
.sidebar {
  width: var(--sidebar);
  flex: none;
  display: flex;
  flex-direction: column;
  padding: 20px 12px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: #edf2f8;
  overflow: hidden;
  transition: width var(--motion);
}
.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  margin: 0 8px 24px;
  font-size: 23px;
  font-weight: 750;
  letter-spacing: -0.7px;
}
.brand-mark {
  position: relative;
  display: block;
  width: 29px;
  height: 29px;
  flex: none;
}
.brand-mark i {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 7px;
  background: #eb69b1;
}
.brand-mark i:nth-child(2) {
  right: 0;
  background: #e993d4;
}
.brand-mark i:nth-child(3) {
  bottom: 0;
  background: #ea73c3;
}
.brand-mark i:nth-child(4) {
  bottom: 0;
  right: 0;
  background: #d97dce;
}
.space-selector {
  width: 100%;
  padding: 8px 8px;
  display: flex;
  gap: var(--space-sm);
  align-items: center;
  border-radius: 12px;
  text-align: left;
  margin-bottom: 16px;
}
.space-selector small {
  display: block;
  font-size: 12px;
}
.space-selector b {
  font-size: 13px;
  font-weight: 550;
  display: block;
  margin-top: 4px;
}
.ai-orb {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  flex: none;
  color: #6d6adb;
  background: radial-gradient(
    circle at 38% 30%,
    #fff 0,
    #e5f5ff 17%,
    #94d3ff 32%,
    #99a4fa 49%,
    #d6a6f5 65%,
    #faf0fd 76%
  );
  box-shadow:
    inset 0 0 6px #fff,
    0 2px 8px #667bd422;
  position: relative;
}
.ai-orb:before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1.5px solid #ffffffc9;
  border-radius: 6px;
  transform: rotate(30deg);
}
.ai-orb .ico {
  width: 17px;
  height: 17px;
  position: relative;
}
.nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
  flex: 1;
}
.nav-label {
  font-size: 12px;
  color: var(--muted);
  padding: 16px 12px 8px;
  letter-spacing: 0.6px;
}
.nav-item {
  height: 39px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  border-radius: 10px;
  color: #516682;
  font-size: 13px;
  white-space: nowrap;
}
.nav-item:hover {
  background: #ffffff65;
}
.nav-item.active {
  background: #e0eafa;
  color: var(--accent);
  font-weight: 600;
}
.nav-item .badge {
  margin-left: auto;
}
.sidebar-bottom {
  margin-top: 12px;
  border-top: 1px solid #ffffff60;
  padding-top: 12px;
}
.user {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  width: 100%;
  padding: 12px 8px;
  text-align: left;
}
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  background: #98a2eb;
  flex: none;
  font-weight: 500;
}
.user b {
  font-size: 12px;
  font-weight: 500;
}
.user small {
  display: block;
  font-size: 12px;
  margin-top: 4px;
}
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}
.globalbar {
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px;
  gap: 12px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  color: var(--muted);
  font-size: 12px;
  min-width: 0;
}
.breadcrumb b {
  font-weight: 500;
  color: var(--ink);
}
.global-search {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  font-size: 12px;
  color: var(--muted);
  min-width: 260px;
  padding: 8px 12px;
  border: 1px solid #e0e8f1;
  border-radius: 9px;
  background: #ffffff70;
}
.global-search kbd {
  margin-left: auto;
  font-size: 12px;
  border: 1px solid #d6dfed;
  border-radius: 4px;
  padding: 0px 4px;
}
kbd {
  font-family: inherit;
}
.icon-btn {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 9px;
  color: #506887;
  position: relative;
  flex: none;
}
.icon-btn:hover {
  background: var(--accent-soft);
  border-color: #dce7f7;
}
.icon-btn.round {
  border: 1px solid var(--line);
  background: #ffffff70;
}
.notification-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  position: absolute;
  right: 7px;
  top: 6px;
}
.env {
  padding: 4px 8px;
  background: #ffffff70;
  border: 1px solid #dbe4ef;
  border-radius: 5px;
  font-size: 12px;
  color: var(--muted);
}
.workspace {
  min-height: 0;
  flex: 1;
  display: flex;
  gap: var(--space-sm);
  position: relative;
}
.sessions {
  width: var(--session);
  flex: none;
  background: #f7f9fc;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sessions-head {
  padding: 20px 16px 12px;
}
.sessions-head h2 {
  font-size: 17px;
}
.search {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
  background: #fff;
  border: 1px solid var(--control-line);
  border-radius: 9px;
  padding: 0 8px;
  height: 34px;
  min-width: 0;
}
.search input {
  border: 0;
  background: none;
  padding: 0;
  width: 100%;
  outline: none;
  font-size: 12px;
}
.search:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.new-chat {
  margin-top: 12px;
  width: 100%;
  justify-content: center;
  color: var(--accent);
  background: #dbeaff;
  border: 1px solid #cce0fe;
}
.btn {
  height: 34px;
  padding: 0 12px;
  border-radius: var(--r-sm);
  display: inline-flex;
  gap: 4px;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  white-space: nowrap;
  border: 1px solid #e2e8f1;
  background: #fff;
  transition:
    background var(--motion),
    box-shadow var(--motion);
  font-weight: 500;
}
.btn:hover {
  background: var(--accent-soft);
  border-color: #cddffc;
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 2px 5px #2674ed20;
}
.btn.primary:hover {
  background: #1765dc;
}
.btn.danger {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}
.btn.soft {
  background: var(--surface-soft);
}
.btn.link {
  border: 0;
  background: none;
  color: var(--accent);
  padding: 0 4px;
}
.session-list {
  overflow: auto;
  padding: 0 12px 20px;
  flex: 1;
  overscroll-behavior: contain;
}
.date-group {
  font-size: 12px;
  color: var(--muted);
  padding: 16px 8px 8px;
}
.session-row {
  position: relative;
  display: flex;
  border-radius: 9px;
  margin: 0px 0;
  content-visibility: auto;
  contain-intrinsic-size: 0 60px;
}
.session-row.active {
  background: #deecff;
}
.session-row.active:before {
  content: "";
  width: 2px;
  height: calc(100% - 18px);
  background: var(--accent);
  position: absolute;
  left: -1px;
  top: 9px;
  border-radius: 2px;
}
.session-select {
  text-align: left;
  flex: 1;
  min-width: 0;
  padding: 12px 8px 8px;
  font-size: 12px;
  display: block;
}
.session-select span {
  white-space: nowrap;
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-right: 16px;
}
.session-select small {
  font-size: 12px;
  display: block;
  margin-top: 4px;
}
.session-row .more {
  position: absolute;
  right: 3px;
  top: 15px;
  width: 26px;
  height: 26px;
  opacity: 1;
}
.session-row:hover {
  background: #e8f1ff;
}
.session-row:hover .more {
  opacity: 1;
}
.chat-panel {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: #fff;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.chat-header {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #e7eef775;
  flex: none;
}
.agent-title {
  font-size: 15px;
  font-weight: 650;
  gap: var(--space-sm);
}
.agent-title button {
  padding: 0;
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  min-width: 0;
  text-align: left;
}
.connected {
  font-size: 12px;
  color: var(--success);
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  background: currentColor;
}
.resource-summary {
  display: flex;
  gap: 12px;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  flex-wrap: wrap;
}
.resource-summary button {
  padding: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  min-height: 24px;
}
.resource-summary .ico {
  width: 12px;
  height: 12px;
}
.chat-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px 24px 12px;
  overscroll-behavior: contain;
}
.chat-scroll > .turn {
  max-width: 800px;
  margin: 0 auto 20px;
}
.question-row {
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  gap: var(--space-sm);
  margin-bottom: 20px;
}
.question-content {
  max-width: 88%;
}
.question {
  background: #edf3fc;
  border: 1px solid #e2eaf6;
  border-radius: 11px 11px 3px 11px;
  padding: 12px 12px;
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.question-time {
  text-align: right;
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}
.question-row .avatar {
  width: 29px;
  height: 29px;
  font-size: 12px;
}
.answer-row {
  display: block;
  gap: 12px;
  align-items: flex-start;
}
.answer-row > .ai-orb {
  width: 30px;
  height: 30px;
  margin-top: 4px;
  display: none;
}
.answer-content {
  flex: 1;
  min-width: 0;
}
.answer-card {
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  overflow: visible;
}
.run-summary {
  width: 100%;
  padding: 8px 0;
  background: transparent;
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  color: var(--muted);
  font-size: 12px;
  border-bottom: 0;
  text-align: left;
}
.run-summary .done-check {
  color: var(--success);
  display: flex;
  gap: 4px;
  align-items: center;
}
.run-summary .link {
  color: var(--accent);
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.answer-body {
  padding: 16px 0 8px;
  font-size: 15px;
  line-height: 1.8;
}
.answer-body h3 {
  margin-bottom: 8px;
  font-size: 16px;
}
.answer-body p {
  line-height: 1.8;
  margin-bottom: 12px;
}
.answer-body ul {
  list-style: none;
  padding: 0;
  margin: 8px 0 0;
}
.answer-body li {
  position: relative;
  padding-left: 16px;
  line-height: 1.75;
  margin: 0px 0;
}
.answer-body li:before {
  content: "";
  background: var(--accent);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  position: absolute;
  left: 1px;
  top: 10px;
}
.answer-body li b {
  font-weight: 550;
}
.cite {
  display: inline-flex;
  padding: 0px 4px;
  border-radius: 4px;
  background: #e9f1ff;
  color: var(--accent);
  font-size: 12px;
  vertical-align: middle;
  margin: 0 0px;
  min-width: 24px;
  min-height: 24px;
  align-items: center;
  justify-content: center;
}
.cite:hover {
  background: #cfe2ff;
}
.cite.citation-linked,
.cite.citation-selected {
  color: #0758c9;
  background: #dceaff;
  box-shadow: 0 0 0 1px #b9d2f5;
}
.answer-footnote {
  font-size: 12px;
  color: var(--muted);
  padding: 0 0 8px;
}
.references {
  margin-top: 12px;
}
.references summary {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  list-style: none;
  padding: 0 0px 8px;
  min-height: 28px;
}
.references summary:after {
  content: "⌄";
  color: var(--muted);
  margin-left: auto;
}
.count-tag {
  font-size: 12px;
  color: var(--accent);
  background: #e4efff;
  padding: 0px 4px;
  border-radius: 4px;
  font-weight: 500;
}
.source-list {
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.source {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  width: 100%;
  padding: 8px 8px;
  border-bottom: 1px solid #edf2f9;
  text-align: left;
  font-size: 12px;
  min-width: 0;
  min-height: 40px;
  transition: background var(--motion), box-shadow var(--motion), color var(--motion);
}
.source:hover { background: #f3f7fd; }
.source.citation-linked,
.source.citation-selected {
  color: #173b70;
  background: #e3edfc;
  box-shadow: inset 3px 0 0 var(--accent);
}
.source.citation-linked .source-index,
.source.citation-selected .source-index {
  color: #0758c9;
  background: #d2e3fb;
}
.source:last-child {
  border-bottom: 0;
}
.source .file-icon {
  color: var(--accent);
}
.source .source-index {
  background: #e0e7f2;
  color: #516681;
  width: 22px;
  height: 17px;
  border-radius: 6px;
  text-align: center;
}
.source-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 48%;
}
.source-location {
  color: var(--muted);
  font-size: 12px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  flex: 1;
}
.source > .ico:last-child {
  width: 13px;
  height: 13px;
  margin-left: auto;
}
.message-actions {
  display: flex;
  gap: 4px;
  padding: 8px 0 0;
}
.message-actions .icon-btn {
  width: 29px;
  height: 29px;
}
.message-actions .ico {
  width: 16px;
  height: 16px;
}
.trace-steps {
  background: #f8fbff;
  padding: 12px 16px;
  font-size: 12px;
  display: grid;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}
.trace-step {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
}
.trace-step .ico {
  color: var(--success);
  width: 13px;
  height: 13px;
}
.trace-step span:last-child {
  margin-left: auto;
  color: var(--muted);
}
.composer-wrap {
  padding: 8px 12px 12px;
  flex: none;
}
.composer {
  max-width: 840px;
  margin: 0 auto;
  background: #ffffffef;
  border: 1px solid var(--control-line);
  border-radius: 12px;
  padding: 12px 12px 8px;
  box-shadow: 0 2px 12px #263a5408;
}
.composer:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.composer-context {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.chip {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  max-width: 100%;
  padding: 0px 4px 0px 8px;
  border-radius: 7px;
  background: #f0f5fd;
  color: #486387;
  font-size: 12px;
}
.chip .ico {
  width: 13px;
  height: 13px;
}
.chip button {
  padding: 0;
  line-height: 1;
  display: flex;
  min-width: 24px;
  min-height: 24px;
  align-items: center;
  justify-content: center;
}
.chip .ico:last-child {
  width: 11px;
  height: 11px;
}
.chip.skill {
  background: #eaf2ff;
  color: #315d9b;
}
.composer textarea {
  height: 41px;
  max-height: 140px;
  resize: none;
  width: 100%;
  border: 0;
  outline: none;
  background: none;
  padding: 4px 0;
  font-size: 14px;
  line-height: 1.6;
}
.composer-bottom {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.composer-bottom .btn {
  font-size: 12px;
  height: 30px;
  padding: 0 8px;
  color: #4d6282;
  background: #f4f7fc;
  border: 0;
}
.composer-bottom .btn.on {
  background: #e6f0ff;
  color: var(--accent);
}
.composer-bottom .btn.model {
  margin-left: auto;
  max-width: 175px;
  overflow: hidden;
}
.send {
  width: 35px;
  height: 33px;
  border-radius: 9px;
  color: white;
  background: #15294f;
  display: grid;
  place-items: center;
  flex: none;
}
.send:hover {
  background: var(--accent);
  color: white;
}
.send .ico {
  width: 17px;
  height: 17px;
}
.composer-note {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin-top: 4px;
}
.viewer {
  width: var(--viewer);
  flex: none;
  border-radius: var(--r-lg);
  background: #f7f9fc;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.viewer-head {
  padding: 16px 16px 12px;
}
.viewer-title {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  font-size: 13px;
  font-weight: 600;
}
.viewer-title b {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.viewer-title > .ico {
  color: var(--accent);
}
.viewer-meta {
  font-size: 12px;
  color: var(--muted);
  margin: 4px 0 12px;
  padding-left: 24px;
}
.viewer-tools {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
  flex-wrap: wrap;
}
.viewer-tools .icon-btn {
  border: 1px solid #dde7f5;
  width: 28px;
  height: 28px;
}
.viewer-tools input {
  width: 40px;
  text-align: center;
  padding: 4px;
  font-size: 12px;
}
.viewer-body {
  overflow: auto;
  padding: 0 12px 12px;
  flex: 1;
  min-height: 0;
}
.paper-viewport {
  overflow: auto;
  background: #e9eef730;
  border-radius: 12px;
}
.doc-paper {
  background: #fff;
  border: 1px solid #e6edf7;
  border-radius: 6px;
  padding: 24px 20px;
  min-height: 385px;
  line-height: 1.7;
  box-shadow: 0 1px 4px #20345008;
  font-family: Arial, sans-serif;
  font-size: 12px;
  transform-origin: top left;
  overflow-wrap: anywhere;
}
.doc-paper h2 {
  font-size: 14px;
  margin: 0 0 16px;
}
.doc-paper h3 {
  font-size: 12px;
  margin-bottom: 16px;
}
.doc-paper p {
  margin-bottom: 16px;
  line-height: 1.75;
}
.doc-paper mark,
.quote-location mark {
  background: #ffedaa;
  color: #544b31;
  padding: 0px 0;
  box-shadow:
    2px 0 #ffedaa,
    -2px 0 #ffedaa;
}
.paper-footer {
  font-size: 11px;
  color: var(--muted);
  border-top: 1px solid #e7ecf3;
  margin-top: 24px;
  padding-top: 8px;
  display: flex;
  justify-content: space-between;
}
.thumbnails {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-sm);
  margin: 12px 0;
}
.thumbnail {
  text-align: center;
  color: var(--muted);
  padding: 0;
  font-size: 12px;
}
.mini-paper {
  height: 72px;
  background: #fff;
  border: 1px solid #e7edf6;
  border-radius: 7px;
  padding: 12px 8px;
  display: block;
  margin-bottom: 8px;
  overflow: hidden;
}
.thumbnail.active {
  color: var(--accent);
}
.thumbnail.active .mini-paper {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px #2674ed25;
}
.mini-paper i {
  height: 2px;
  background: #d9e0eb;
  margin-bottom: 4px;
  display: block;
}
.mini-paper i:nth-child(3n) {
  width: 77%;
}
.thumbnail.active .mini-paper i:nth-child(4),
.thumbnail.active .mini-paper i:nth-child(5) {
  background: #ffe296;
}
.quote-label {
  font-size: 12px;
  color: var(--muted);
  margin: 16px 0 8px;
}
.quote-location {
  background: #ffffffad;
  border: 1px solid #e7edf7;
  border-radius: 13px;
  padding: 12px;
  font-size: 12px;
  line-height: 1.7;
}
.quote-location h3 {
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 8px;
}
.quote-location .flex {
  margin-top: 12px;
  font-size: 12px;
}
.content-surface {
  background: #fbfcfe;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: auto;
  width: 100%;
  padding: 24px 32px;
  min-height: 0;
  overscroll-behavior: contain;
}
.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  margin-bottom: 24px;
}
.page-heading p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  margin: 0 0 16px;
  flex-wrap: wrap;
}
.toolbar .search {
  width: 260px;
  background: #fff;
}
.toolbar select {
  font-size: 12px;
  height: 34px;
  max-width: 190px;
}
.toolbar .view-switch {
  margin-left: auto;
  display: flex;
  background: #eef3fa;
  padding: 4px;
  border-radius: 8px;
  gap: 0px;
}
.view-switch button {
  width: 29px;
  height: 27px;
  border-radius: 5px;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.view-switch button.active {
  background: #fff;
  color: var(--accent);
  box-shadow: 0 1px 5px #3250770c;
}
.table-wrap {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  overflow: auto;
}
.table-wrap table {
  border-collapse: collapse;
  width: 100%;
  text-align: left;
  font-size: 13px;
  white-space: nowrap;
}
.table-wrap th {
  height: 39px;
  background: #f1f4f8;
  color: var(--muted);
  font-weight: 500;
  padding: 0 16px;
  font-size: 12px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 1;
}
.table-wrap td {
  height: 48px;
  padding: 0 16px;
  border-bottom: 1px solid #eff2f7;
  color: #4a5e7c;
}
.table-wrap tr:last-child td {
  border: 0;
}
.table-wrap tr:hover td {
  background: #f8fbff;
}
.table-wrap td b {
  color: var(--ink);
  font-weight: 550;
}
.table-name {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  color: var(--ink);
  max-width: 290px;
  text-align: left;
  font-size: 12px;
}
.table-name .ico {
  color: #7396c5;
}
.table-name span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.table-actions {
  display: flex;
  gap: 4px;
}
.table-actions .icon-btn {
  width: 27px;
  height: 27px;
}
.table-actions .ico {
  width: 15px;
  height: 15px;
}
.badge {
  font-size: 12px;
  display: inline-flex;
  gap: 4px;
  align-items: center;
  background: #edf2f8;
  color: var(--muted);
  padding: 4px 8px;
  border-radius: 6px;
  white-space: nowrap;
}
.badge.ready,
.badge.done,
.badge.connected {
  color: var(--success);
  background: var(--success-bg);
}
.badge.failed,
.badge.error,
.badge.auth {
  color: var(--danger);
  background: var(--danger-bg);
}
.badge.pending,
.badge.draft {
  color: var(--warning);
  background: var(--warning-bg);
}
.badge.processing,
.badge.connecting,
.badge.syncing {
  color: var(--accent);
  background: var(--accent-soft);
}
.badge .ico {
  width: 12px;
  height: 12px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
  gap: var(--space-md);
}
.card {
  padding: 16px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: none;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.card:hover {
  border-color: #cddff4;
}
.card-head {
  display: flex;
  align-items: flex-start;
  gap: var(--space-sm);
  margin-bottom: 12px;
}
.card-head h3 {
  margin-bottom: 4px;
  font-size: 16px;
}
.card p {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.7;
  min-height: 40px;
}
.card .badge {
  margin-left: auto;
}
.card-info {
  margin: 12px 0;
  display: grid;
  gap: 4px;
  font-size: 12px;
  color: #657796;
}
.card-info .flex span:last-child {
  margin-left: auto;
  color: var(--ink);
}
.card-foot {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
  gap: var(--space-sm);
  margin-top: auto;
}
.skill-icon {
  display: grid;
  place-items: center;
  width: 37px;
  height: 37px;
  background: #eff5ff;
  color: #6589c2;
  border-radius: 11px;
  flex: none;
}
.card-head small {
  font-size: 12px;
}
.tabs {
  display: flex;
  gap: 24px;
  border-bottom: 1px solid #e1e8f3;
  margin-bottom: 20px;
  overflow: auto;
}
.tabs button,
.tabs a {
  padding: 0 0px 12px;
  font-size: 12px;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  color: var(--muted);
}
.tabs .active {
  color: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}
.detail-back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 16px;
}
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.metric {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 16px;
  text-align: left;
  min-width: 0;
}
.metric-label {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.metric-label .ico {
  width: 15px;
  height: 15px;
  color: #9aabc2;
}
.metric b {
  display: block;
  font-size: 26px;
  font-weight: 650;
  color: var(--ink);
  margin: 8px 0 8px;
  letter-spacing: -0.5px;
}
.metric small {
  font-size: 12px;
}
.metric.action:hover {
  border-color: #accaf3;
  background: #fbfdff;
}
.metric.warning b {
  color: var(--warning);
}
.metric.danger b {
  color: var(--danger);
}
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: var(--space-md);
  margin-bottom: 20px;
}
.panel {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: var(--r);
  padding: var(--space-20);
  min-width: 0;
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: var(--space-sm);
}
.panel-head h2 {
  font-size: 15px;
}
.panel-head small {
  font-size: 12px;
}
.trend {
  height: 185px;
  width: 100%;
  display: block;
  color: var(--accent);
  overflow: visible;
}
.chart-labels {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}
.insight {
  background: #fff;
  border-color: var(--line);
}
.insight-item {
  display: flex;
  gap: var(--space-sm);
  padding: 12px 0;
  font-size: 12px;
  border-bottom: 1px solid var(--line);
  align-items: flex-start;
}
.insight-item p {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
}
.insight-item > .ico {
  color: var(--accent);
  width: 16px;
  height: 16px;
  margin-top: 4px;
}
.progress {
  height: 4px;
  border-radius: 3px;
  background: #edf2f9;
  overflow: hidden;
  margin: 12px 0;
}
.progress span {
  display: block;
  height: 100%;
  background: #83b0ef;
  border-radius: 3px;
  transition: width var(--motion);
}
.setting-layout {
  display: grid;
  grid-template-columns: 175px minmax(0, 1fr);
  gap: 24px;
}
.setting-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.setting-nav button {
  padding: 12px 12px;
  text-align: left;
  border-radius: 8px;
  font-size: 12px;
  color: var(--muted);
}
.setting-nav button.active {
  background: var(--accent-soft);
  color: var(--accent);
}
.form-panel {
  max-width: 790px;
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 24px;
}
.form-panel h2 {
  font-size: 16px;
  margin-bottom: 8px;
}
.form-panel > p {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 20px;
}
.field {
  display: grid;
  gap: var(--space-sm);
  margin-bottom: 16px;
}
.field > label {
  font-size: 12px;
  font-weight: 550;
}
.field input,
.field textarea,
.field select {
  width: 100%;
  font-size: 12px;
}
.field .error-text {
  color: var(--danger);
  font-size: 12px;
}
.field small {
  font-size: 12px;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-md);
}
.checks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-sm);
  margin-top: 8px;
}
.checks label {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 12px;
}
.checks input {
  margin: 0;
  accent-color: var(--accent);
}
.setting-row {
  display: flex;
  gap: var(--space-md);
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.setting-row > div {
  flex: 1;
}
.setting-row p {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}
.setting-row input[type="checkbox"] {
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
}
.empty {
  padding: 50px 16px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  grid-column: 1/-1;
}
.empty > .ico {
  width: 29px;
  height: 29px;
  color: #a2b5cf;
}
.empty h3 {
  font-size: 14px;
}
.empty p {
  font-size: 12px;
  color: var(--muted);
  max-width: 330px;
}
.welcome {
  max-width: 640px;
  padding: 40px 4px 24px;
  margin: auto;
}
.welcome > .ai-orb {
  width: 47px;
  height: 47px;
  margin-bottom: 20px;
}
.welcome h1 {
  font-size: 22px;
  margin-bottom: 8px;
}
.welcome > p {
  font-size: 12px;
  color: var(--muted);
}
.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 24px 0 20px;
}
.suggestion {
  padding: 16px;
  background: #ffffff9e;
  border: 1px solid #e2eaf6;
  border-radius: 12px;
  text-align: left;
}
.suggestion span {
  display: block;
  color: var(--accent);
  font-size: 12px;
  margin-bottom: 8px;
}
.suggestion p {
  font-size: 12px;
  line-height: 1.7;
}
.suggestion:hover {
  border-color: #b0ccf5;
  box-shadow: var(--shadow);
}
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
  padding-top: 12px;
}
.pagination .btn {
  height: 27px;
}
.overlay {
  position: fixed;
  inset: 0;
  background: #1c355e30;
  z-index: 70;
  display: grid;
  place-items: center;
  padding: var(--space-20);
  backdrop-filter: blur(3px);
}
.modal {
  width: min(620px, 100%);
  max-height: 90dvh;
  display: flex;
  flex-direction: column;
  background: #fff;
  border: 1px solid #fff;
  border-radius: 18px;
  box-shadow: var(--shadow-pop);
  overflow: hidden;
}
.modal-head {
  padding: 20px 24px 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.modal-head h2 {
  font-size: 18px;
  margin-bottom: 8px;
}
.modal-head p {
  font-size: 12px;
  color: var(--muted);
}
.modal-body {
  padding: 4px 24px 20px;
  overflow: auto;
  overscroll-behavior: contain;
}
.modal-foot {
  border-top: 1px solid var(--line);
  padding: 12px 24px;
  display: flex;
  justify-content: flex-end;
  gap: var(--space-sm);
  background: #fbfcfe;
}
.modal-foot small {
  margin-right: auto;
  align-self: center;
}
.popover {
  position: fixed;
  z-index: 85;
  background: #fff;
  border: 1px solid #e2e9f3;
  border-radius: 12px;
  box-shadow: var(--shadow-pop);
  padding: 4px;
  min-width: 180px;
  max-width: calc(100vw - 24px);
}
.popover button {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  width: 100%;
  text-align: left;
  padding: 8px 8px;
  font-size: 12px;
  border-radius: 7px;
}
.popover button:hover {
  background: var(--accent-soft);
}
.popover button small {
  margin-left: auto;
  font-size: 12px;
}
.popover .danger-text {
  color: var(--danger);
}
.popover .menu-heading {
  padding: 8px 8px;
  color: var(--muted);
  font-size: 12px;
}
.popover .model-option {
  display: block;
}
.model-option b {
  font-weight: 550;
  display: block;
  margin-bottom: 4px;
}
.model-option span {
  font-size: 12px;
  color: var(--muted);
}
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: #1c355e20;
  z-index: 60;
  display: flex;
  justify-content: flex-end;
}
.drawer {
  width: min(470px, 100%);
  background: #fcfdff;
  height: 100%;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-pop);
  animation: drawer-in var(--motion) ease-out;
}
.drawer .modal-head {
  border-bottom: 1px solid var(--line);
}
.drawer-body {
  padding: 24px;
  overflow: auto;

}
.kv dd {

}
.drawer .chips {

  max-width: 90vw;
}
.toast {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  border: 1px solid #e1e8f3;
  background: #fff;
  border-radius: 10px;
  box-shadow: var(--shadow-pop);
  padding: 12px 16px;
  font-size: 12px;
  animation: toast-in var(--motion) ease-out;
  min-width: 220px;
}
.toast.success > .ico {
  color: var(--success);
}
.toast.error > .ico {
  color: var(--danger);
}
.toast.warning > .ico {
  color: var(--warning);
}
.toast.info > .ico {
  color: var(--accent);
}
.palette {

}

  padding: 12px;

  font-size: 12px;
}

}

  function kbStats(id) {

      pending = docs.filter((d) => d.status === "pending").length,
      processing = docs.filter((d) => d.status === "processing").length;
    return {
      docs: docs.length,
      done: done.length,
      failed,
      pending,
      processing,
      chunks: done.reduce((n, d) => n + d.chunks, 0),
      tokens: done.reduce((n, d) => n + d.tokens, 0),
      status: failed

            ? "pending"
            : docs.length

  function processFiles(files) {
    const target = state.uploadTarget;
    if (!target) return;
    const total = state.uploadItems.length;
    if (total + files.length > 10) {
      toast("单次最多上传 10 份文件。", "warning");
      return;
    }
    Array.from(files).forEach((f) => {
      const item = {
        id: uid("up"),
        name: f.name,
        size: (f.size / 1048576).toFixed(2) + " MB",
        status: "processing",
        stage: "上传中",
        progress: 0,
      };
      state.uploadItems.push(item);
      if (
        !/\.(pdf|docx|txt|md)$/i.test(f.name) ||
        f.size > 104857600 ||
        !f.size
      ) {
        item.status = "failed";
        item.error =
          f.size > 104857600
            ? "文件超过 100 MB 上限。"
            : !f.size
              ? "文件为空，请选择包含内容的文件。"
              : "格式不支持，请选择 PDF、DOCX、TXT 或 MD。";
        toast(item.error, "error");
        return;
      }
      const task = {
        id: uid("task"),
        name: f.name,
        kind: target === "chat" ? "附件上传" : "文档上传与解析",
        kb: target === "chat" ? null : target,
        status: "processing",
        progress: 0,
        time: now(),
      };
      db.tasks.unshift(task);
      let doc;
      if (target !== "chat") {
        doc = {
          id: uid("upload"),
          kb: target,
          name: f.name,
          size: item.size,
          status: "pending",
          chunks: 0,
          tokens: 0,
          updated: now(),
          total: 26,
          version: "V1.0",
        };
        db.documents.push(doc);
        task.doc = doc.id;
      } else task.session = db.ui.session;
      save();
      const timer = setInterval(() => {
        if (
          task.status !== "processing" ||
          !db.tasks.includes(task) ||
          (target !== "chat" && !get("knowledge", target))
        ) {
          clearInterval(timer);
          return;
        }
        item.progress = Math.min(100, item.progress + 10);
        task.progress = item.progress;
        if (item.progress >= 50) {
          item.stage = "解析中";
          if (doc) doc.status = "processing";
        }
        if (item.progress === 100) {
          clearInterval(timer);
          item.status = "done";
          task.status = "done";
          if (doc) {
            doc.status = "done";
            doc.chunks = 42;
            doc.tokens = 12480;
            get("knowledge", target).updated = now();
          } else {
            const c =
              db.contexts[task.session] ||
              (db.contexts[task.session] = {
                skill: null,
                attachments: [],
                web: false,
              });
            c.attachments.push({ name: f.name, size: item.size });
            if (db.ui.session === task.session && state.route === "chat")
              updateContext();
          }
          save();
          notify(
            target === "chat" ? "附件上传完成" : "知识文档解析完成",
            f.name +
              " 已可用于" +
              (target === "chat" ? "当前对话" : "知识检索"),
            target === "chat"
              ? "chat"
              : "knowledge?id=" + target + "&tab=documents",
          );
          toast(f.name + " 已处理完成");
        }
        updateTaskUI();
      }, 220);
    });
    if ($(".upload-list")) $(".upload-list").innerHTML = uploadList();
  }

  function commandResults(q) {
    const match = (v) => String(v).toLowerCase().includes(q.toLowerCase());
    const groups = [
      [
        "智能体",
        "agents",
        db.agents.filter((x) => match(x.name)).slice(0, 4),
        "bot",
      ],
      [
        "知识库",
        "knowledge",
        db.knowledge.filter((x) => match(x.name)).slice(0, 4),
        "book",
      ],
      [
        "文档",
        "documents",
        db.documents.filter((x) => match(x.name)).slice(0, 5),
        "file",
      ],
      [
        "会话",
        "sessions",
        db.sessions.filter((x) => match(x.title)).slice(0, 4),
        "msg",
      ],
      [
        "Skills",
        "skills",
        db.skills.filter((x) => match(x.name)).slice(0, 4),
        "puzzle",
      ],
    ];
    state.paletteResults = [];
    $("#command-results").innerHTML =
      groups
        .map(([label, type, list, i]) =>
          list.length
            ? `<div class="palette-group">${label}</div>${list
                .map((x) => {
                  const index = state.paletteResults.length;
                  state.paletteResults.push({ type, id: x.id });
                  return `<button class="palette-result ${index === state.paletteIndex ? "active" : ""}" data-action="command-open" data-id="${index}">${icon(i, "sm")}<span class="grow">${esc(x.name || x.title)}</span><small>${type === "documents" ? get("knowledge", x.kb)?.name : label}</small></button>`;
                })
                .join("")}`
            : "",
        )
        .join("") || empty("没有匹配结果", "尝试输入名称、标准编号或关键词。");
    state.paletteIndex = Math.min(
      state.paletteIndex,
      Math.max(0, state.paletteResults.length - 1),

  function highlightCommand() {

  function openCommand(index) {

    closeCommand();
    if (x.type === "agents") navigate("agents?id=" + x.id);
    if (x.type === "knowledge") navigate("knowledge?id=" + x.id);
    if (x.type === "documents") {
      state.viewer.open = true;
      state.viewer.doc = x.id;
      state.viewer.page = 1;
      state.viewer.cite = 0;
      navigate("chat");
    }
    if (x.type === "sessions") {
      db.ui.session = x.id;

  // All historic versions preserve a configuration snapshot, rather than only a label.
  const configKeys = [
    "model",
    "kbs",
    "skills",
    "mcps",
    "prompt",
    "temperature",
    "status",
  ];
  function configSnapshot(a) {
    return Object.fromEntries(
      configKeys.map((k) => [
        k,
        structuredClone(
          a[k] ?? (k === "temperature" ? 0.3 : k === "prompt" ? "" : null),
        ),
      ]),
    );
  }
  db.agents.forEach((a) =>
    a.versions.forEach((v, i) => {
      if (!v.config) {
        v.config = configSnapshot(a);
        if (i > 0)
          v.config.model =
            db.models[
              (db.models.findIndex((m) => m.id === a.model) + i) %
                db.models.length
            ].id;
        if (i > 1) v.config.skills = v.config.skills.slice(0, 2);
      }
    }),
  );
  function saveAgent(id, onlyModel = false, root) {
    const a = get("agents", id),
      v = formValues(root);
    if (!onlyModel && !validateName(v.name)) return false;
    if (
      onlyModel &&
      (!Number.isFinite(Number(v.temperature)) ||
        Number(v.temperature) < 0 ||
        Number(v.temperature) > 2)
    ) {
      toast("温度需要在 0–2 之间。", "warning");
      return false;
    }
    if (!onlyModel)
      Object.assign(a, {
        name: v.name,
        desc: v.desc,
        prompt: v.prompt,
        status: v.status,
        kbs: v.kbs || [],
        skills: v.skills || [],
        mcps: v.mcps || [],
      });
    a.model = v.model;
    if (onlyModel) a.temperature = Number(v.temperature);
    a.updated = now();
    const version =
      "v1." +
      (Math.max(
        ...a.versions.map((x) => Number(x.version.split(".").pop()) || 0),
      ) +
        1);
    a.version = version;
    a.versions.unshift({
      version,
      date: a.updated,
      by: "张伟",
      note: "更新模型、知识库或能力绑定配置",
      config: configSnapshot(a),
    });
    save();
    toast("配置已保存并发布 " + version);
    return true;
  }

      }
      case "retry-task": {
        const task = get("tasks", id);
        if (task.doc) {
          reparse(task.doc);
        } else if (task.experiment) {
          runExperiment(task.experiment);
        } else toast("请重新选择文件并上传。", "info");
        break;
      }
      case "save-settings":
        if (!allowed(true)) return;
        {
          const name = $("#f-spaceName").value.trim();
          if (!validateName(name)) return;
          db.settings.name = name;
          db.settings.description = $("#f-spaceDesc").value;
          save();
          toast("空间信息已保存。");
          break;
        }
      case "add-member":
      case "edit-member":
        if (!allowed(true)) return;
        {
          const m = name === "edit-member" ? db.members[Number(id)] : {};
          openModal(
            name === "edit-member" ? "编辑成员" : "添加成员",
            "本地演示成员，不会发送邀请邮件",
            field("姓名", "name", m.name || "") +
              field("邮箱", "email", m.email || "", "email") +
              selectField(
                "角色",
                "role",
                ["编辑者", "成员", "管理员"],
                m.role || "成员",
              ),
            () => {
              const v = formValues();
              if (!validateName(v.name)) return;
              if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) {
                $("#err-email").textContent = "请输入有效的邮箱地址。";
                return;
              }
              if (name === "edit-member") Object.assign(m, v);
              else db.members.push(v);
              save();
              closeModal();
              render();
              toast("成员信息已保存。");
            },
          );
          break;
        }
      case "apply-role":
        db.settings.role = $("#f-role").value;
        save();
        render();
        toast("演示角色已切换为 " + db.settings.role);
        break;
      case "configure-model":
        if (!allowed(true)) return;
        openModal(
          id,
          "配置演示模型服务；不会调用真实 API",
          field("服务地址", "endpoint", "https://api.example.com", "url") +
            field(
              "API Key",
              "apiKey",
              "",
              "password",
              "凭证仅用于界面演示，不持久化保存。",
            ),
          () => {
            closeModal();
            toast("模型配置已验证（模拟）。");
          },
          "验证配置",
        );
        break;
      case "save-default-model":
        if (!allowed(true)) return;
        db.settings.defaultModel = $("#f-defaultModel").value;
        save();
        toast("默认模型已保存。");
        break;
      case "save-defaults":
        if (!allowed(true)) return;
        db.settings.defaultKB = $("#f-defaultKB").value;
        db.settings.defaultModel = $("#f-defaultModel").value;
        save();
        toast("默认配置已保存。");
        break;
      case "save-privacy":
        if (!allowed(true)) return;
        db.settings.privacy = $("#privacy-toggle").checked;
        db.settings.retention = $("#f-retention").value;
        save();
        toast("数据设置已保存。");
        break;
      case "export-data":
        download("AIP05-演示空间.json", JSON.stringify(db, null, 2));
        break;
      case "reset-data":
        if (!allowed(true)) return;
        confirmDialog(
          "重置演示空间？",
          "所有本地更改、会话草稿及上传记录将清除，恢复初始演示数据。",
          () => {
            db = structuredClone(window.AIPSeed);
            db.agents.forEach((a) =>
              a.versions.forEach((v) => (v.config = configSnapshot(a))),
            );
            state.viewer = {
              open: true,
              doc: "d0-0",
              page: 8,
              cite: 0,
              zoom: 100,
              error: false,
            };
            navigate("chat");
            toast("演示数据已恢复。");
          },
        );
        break;
      case "demo-states":
        openModal(
          "异常状态演示",
          "选择要查看的反馈状态",
          `<div class="stack">${btn("模拟网络异常", "simulate-network")}${btn("模拟 AI 生成失败", "simulate-ai-error")}${btn("模拟文档加载失败", "simulate-document-error")}${btn("查看认证失败 MCP", "mcp-detail", "mc5")}${btn("模拟无权限操作", "simulate-permission")}</div>`,
        );
        break;
      case "simulate-network":
        toast("网络连接异常，请检查连接后重试。", "error");
        openModal(
          "网络连接异常",
          "暂时无法加载运行数据",
          '<div class="callout error">网络暂时不可用，请检查连接。当前本地数据仍可访问。</div>',
          () => {
            closeModal();
            toast("网络已恢复（模拟）。");
          },
          "重新连接",
        );
        break;
      case "simulate-ai-error":
        closeMenu();
        closeModal();
        newSession();
        navigate("chat");
        setTimeout(() => {
          if (state.route === "chat") {
            $("#prompt").value = "请总结 3GPP TS 25.420 的核心内容";
            sendMessage(true);
          }
        }, 80);
        break;
      case "simulate-document-error":
        closeModal();
        state.viewer.open = true;
        state.viewer.error = true;
        navigate("chat");
        break;
      case "simulate-permission":
        openModal(
          "无操作权限",
          "当前演示操作需要管理员权限",
          '<div class="callout warning">请联系工作空间管理员开通权限。</div>',
        );
        break;
      case "guide":
        openModal(
          "开始使用 AIP05",
          "企业 AI 工作台 · 任务、知识与质量的统一入口",
          `<div class="stack">${[
            [
              "1. 配置智能体",
              "选择模型、绑定知识库与 Skills，连接需要的 MCP 工具。",
            ],
            [
              "2. 开始对话",
              "选择会话或新建任务，添加文档，输入业务问题。未发送草稿自动保存。",
            ],
            ["3. 核验来源", "点击答案引用，打开原文、页码和高亮段落。"],
            ["4. 持续改进", "从调用记录加入评测数据集，比较版本并发布新配置。"],
          ]
            .map(
              ([h, p]) =>
                `<div><h3>${h}</h3><p class="muted" style="margin-top:7px">${p}</p></div>`,
            )
            .join(
              "",
            )}<div class="callout">快捷键：⌘ / Ctrl + K 全局搜索；Enter 发送；Shift + Enter 换行；Esc 关闭弹窗。</div></div>`,
        );
        break;
      default:
        console.warn("Unknown action", name);
    }
  }
  document.addEventListener("pointerdown", (e) => {
    const handle = e.target.closest(".session-resize");
    if (!handle || innerWidth < 1200) return;
    e.preventDefault();
    const width = $(".sessions").getBoundingClientRect().width,
      start = e.clientX;
    const move = (ev) => {
      db.ui.sessionWidth = Math.max(
        200,
        Math.min(360, width + ev.clientX - start),
      );
      $("#app").style.setProperty("--session", db.ui.sessionWidth + "px");
      handle.setAttribute("aria-valuenow", db.ui.sessionWidth);
    };
    const end = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", end);
      document.body.style.userSelect = "";
      save();
    };
    document.body.style.userSelect = "none";
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", end, { once: true });
  });
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-action]");
    if (t) {
      e.preventDefault();
      action(t.dataset.action, t.dataset.id, t);
      return;
    }
    if (e.target.dataset.overlay) {
      if (e.target.dataset.overlay === "modal") closeModal();
      if (e.target.dataset.overlay === "palette") closeCommand();
      if (e.target.dataset.overlay === "drawer") closeDrawer();
    } else if (!e.target.closest(".popover")) closeMenu();
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.hasAttribute("aria-invalid")) {
      t.removeAttribute("aria-invalid");
      const err = document.getElementById("err-" + t.name);
      if (err) err.textContent = "";
    }
    if (t.id === "prompt") {
      db.drafts[db.ui.session] = t.value;
      updateSendState();
      save();
      t.style.height = "41px";
      t.style.height = Math.min(140, t.scrollHeight) + "px";
    }
    if (t.id === "session-search") {
      state.sessionQuery = t.value;
      $("#session-list").innerHTML = renderSessions();
    }
    if (t.id === "page-search") {
      state.filters.q = t.value;
      state.docPage = 1;
      const start = t.selectionStart;
      const scroll = $(".content-surface")?.scrollTop || 0;
      render();
      const input = $("#page-search");
      input?.focus();
      input?.setSelectionRange(start, start);
      if ($(".content-surface")) $(".content-surface").scrollTop = scroll;
    }
    if (t.id === "command-input") {
      state.paletteIndex = 0;
      commandResults(t.value);
    }
    if (t.id === "find-chat-input") {
      $("#find-chat-results").innerHTML =
        session()
          .messages.filter((m) => m.question.includes(t.value))
          .map((m) => btn(esc(m.question), "jump-message", m.id, "link"))
          .join("") || empty("无匹配消息", "请更换关键词。");
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id.startsWith("filter-")) {
      state.filters[t.id.slice(7)] = t.value;
      state.docPage = 1;
      render();
    }
    if (t.id === "doc-page-input") {
      const d = get("documents", state.viewer.doc);
      state.viewer.page = Math.max(1, Math.min(d.total, Number(t.value) || 1));
      updateViewer();
    }
    if (t.id === "file-input") {
      processFiles(t.files);
      t.value = "";
    }
  });
  document.addEventListener("keydown", (e) => {
    if (
      e.target.classList.contains("session-resize") &&
      ["ArrowLeft", "ArrowRight"].includes(e.key)
    ) {
      e.preventDefault();
      db.ui.sessionWidth = Math.max(
        200,
        Math.min(
          360,
          (db.ui.sessionWidth || 238) + (e.key === "ArrowRight" ? 10 : -10),
        ),
      );
      $("#app").style.setProperty("--session", db.ui.sessionWidth + "px");
      e.target.setAttribute("aria-valuenow", db.ui.sessionWidth);
      save();
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      if ($("#palette-root").children.length) closeCommand();
      else command();
      return;
    }
    if (e.key === "Escape") {
      if ($("#preview-root").children.length) hidePreview();
      if ($("#palette-root").children.length) closeCommand();
      else if ($("#modal-root").children.length) closeModal();
      else if ($("#drawer-root").children.length) closeDrawer();
      else if ($("#menu-root").children.length) closeMenu(true);
      else {
        $("#app").classList.remove("nav-open", "sessions-open");
        if (innerWidth < 768 && state.viewer.open) {
          state.viewer.open = false;
          $(".viewer")?.remove();
          polishSemantics();
          if (viewerFocusReturn?.isConnected) viewerFocusReturn.focus();
        }
      }
      return;
    }
    if (
      $("#command-input") &&
      ["ArrowDown", "ArrowUp", "Enter"].includes(e.key)
    ) {
      e.preventDefault();
      if (e.key === "Enter") openCommand(state.paletteIndex);
      else {
        state.paletteIndex = Math.max(
          0,
          Math.min(
            state.paletteResults.length - 1,
            state.paletteIndex + (e.key === "ArrowDown" ? 1 : -1),
          ),
        );
        highlightCommand();
      }
      return;
    }
    if (
      e.target.id === "prompt" &&
      e.key === "Enter" &&
      !e.shiftKey &&
      !e.isComposing
    ) {
      e.preventDefault();
      sendMessage();
      return;
    }
    const overlay =
      $("#palette-root .modal") ||
      $("#modal-root .modal") ||
      $("#drawer-root .drawer") ||
      (innerWidth < 768 ? $(".viewer") : null);
    if (overlay && e.key === "Tab") {
      const items = $$(
        'button:not(:disabled),input,textarea,select,a[href],[tabindex="0"]',
        overlay,
      ).filter((el) => el.offsetParent !== null);
      const first = items[0],
        last = items.at(-1);
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last?.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first?.focus();
      }
    }
    if ($("#popover") && ["ArrowDown", "ArrowUp"].includes(e.key)) {
      const items = $$("button", $("#popover"));
      const i = items.indexOf(document.activeElement);
      e.preventDefault();
      items[
        (i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length
      ]?.focus();
    }
  });
  document.addEventListener("dragover", (e) => {
    const zone = e.target.closest(".upload-zone");
    if (zone) {
      e.preventDefault();
      zone.classList.add("drag");
    }
  });
  document.addEventListener("dragleave", (e) =>
    e.target.closest(".upload-zone")?.classList.remove("drag"),
  );
  document.addEventListener("drop", (e) => {
    const zone = e.target.closest(".upload-zone");
    if (zone) {
      e.preventDefault();
      zone.classList.remove("drag");
      processFiles(e.dataTransfer.files);
    }
  });
  function citationLinkNodes(t) {
    const turn = t?.closest(".turn");
    if (!turn || t.dataset.cite == null) return [];
    return $$('[data-cite]', turn).filter(
      (node) =>
        node.dataset.cite === t.dataset.cite &&
        node.dataset.id === t.dataset.id,
    );
  }
  function setCitationLink(t, active) {
    citationLinkNodes(t).forEach((node) =>
      node.classList.toggle("citation-linked", active),
    );
  }
  function selectCitationLink(t) {
    $$(".citation-selected").forEach((node) => {
      node.classList.remove("citation-selected");
      node.removeAttribute("aria-current");
    });
    const nodes = citationLinkNodes(t);
    nodes.forEach((node) => {
      node.classList.add("citation-selected");
      node.setAttribute("aria-current", "true");
    });
    nodes
      .find((node) => node.classList.contains("source"))
      ?.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  let hoverTimer, previewAnchor;
  function hidePreview() {
    clearTimeout(hoverTimer);
    previewAnchor?.removeAttribute("aria-describedby");
    previewAnchor = null;
    $("#preview-root").innerHTML = "";
  }
  function showPreview(t) {
    hidePreview();
    if (!t?.isConnected) return;
    previewAnchor = t;
    const r = t.getBoundingClientRect(),
      isCitation = t.hasAttribute("data-preview");
    t.setAttribute("aria-describedby", "context-preview");
    let body;
    if (isCitation) {
      const d = get("documents", t.dataset.id),
        ci = citationInfo[Number(t.dataset.preview) % 3];
      body = `<b>${esc(d?.name || "来源文档已删除")}</b><p>${esc(d?.version || "")} · ${esc(get("knowledge", d?.kb)?.name || "知识库来源")}</p><p>第 ${ci.page} 页 · ${ci.section}</p><p>点击或按 Enter，打开对应原文</p>`;
    } else body = esc(t.dataset.tooltip);
    $("#preview-root").innerHTML =
      `<div id="context-preview" role="tooltip" class="${isCitation ? "hover-preview" : "tooltip"}" style="left:${Math.max(10, Math.min(r.left, innerWidth - 320))}px;top:${r.top < (isCitation ? 150 : 55) ? r.bottom + 8 : r.top - (isCitation ? 138 : 40)}px">${body}</div>`;
  }
  document.addEventListener("mouseover", (e) => {
    if (e.target.closest("#context-preview")) {
      clearTimeout(hoverTimer);
      return;
    }
    const t = e.target.closest("[data-preview],[data-tooltip]");
    if (!t) return;
    if (t.matches(".cite,.source")) setCitationLink(t, true);
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => showPreview(t), 300);
  });
  document.addEventListener("mouseout", (e) => {
    if (e.target.closest("[data-preview],[data-tooltip],#context-preview")) {
      const t = e.target.closest(".cite,.source");
      if (t && !t.contains(e.relatedTarget)) setCitationLink(t, false);
      clearTimeout(hoverTimer);
      if (
        !e.relatedTarget?.closest?.(
          "[data-preview],[data-tooltip],#context-preview",
        )
      )
        hoverTimer = setTimeout(hidePreview, 180);
    }
  });
  document.addEventListener("focusin", (e) => {
    const t = e.target.closest("[data-preview],[data-tooltip]");
    if (t) {
      if (t.matches(".cite,.source")) setCitationLink(t, true);
      showPreview(t);
    }
    else hidePreview();
  });
  document.addEventListener("focusout", (e) => {
    const t = e.target.closest(".cite,.source");
    if (t) setCitationLink(t, false);
    if (e.target === previewAnchor) hidePreview();
  });
  document.addEventListener("scroll", hidePreview, true);
  function polishSemantics() {
    const mobileViewer = innerWidth < 768 && !!$(".viewer");
    $(".viewer")?.setAttribute(
      "role",
      mobileViewer ? "dialog" : "complementary",
    );
    if (mobileViewer) $(".viewer")?.setAttribute("aria-modal", "true");
    else $(".viewer")?.removeAttribute("aria-modal");
    $$(".chat-panel,.sessions,#globalbar,#sidebar").forEach(
      (el) => (el.inert = mobileViewer),
    );

    $$(".table-wrap").forEach((w) => {
      w.tabIndex = 0;
      w.setAttribute("role", "region");
      w.setAttribute(
        "aria-label",
        (w.closest(".panel")?.querySelector("h2")?.textContent ||
          $(".page-heading h1")?.textContent ||
          "数据") + "表格，可横向滚动",
      );
      const table = w.querySelector("table");
      if (!table) return;
      table.querySelectorAll("th").forEach((th, i) => {
        th.scope = "col";
        if (!th.textContent.trim()) th.textContent = "操作";
        if (
          /^(文档|已解析|分块|知识库|耗时|Token|评分|数量|大小)$/.test(
            th.textContent.trim(),
          ) &&
          th.textContent.trim() !== "知识库"
        ) {
          th.classList.add("numeric");
          table
            .querySelectorAll("tbody tr")
            .forEach((tr) => tr.children[i]?.classList.add("numeric"));
        }
      });
    });
    $$(".tabs button,.setting-nav button,.view-switch button").forEach((b) =>
      b.setAttribute("aria-pressed", b.classList.contains("active")),
    );
    $$(".cite,.source[data-cite]").forEach((b) =>
      b.setAttribute(
        "aria-current",
        String(
          state.viewer.open &&
            b.dataset.id === state.viewer.doc &&
            Number(b.dataset.cite) === state.viewer.cite,
        ),
      ),
    );
    const prev = $('[data-action="doc-prev"]'),
      next = $('[data-action="doc-next"]');
    if (prev) prev.disabled = state.viewer.page <= 1;
    if (next)
      next.disabled =
        state.viewer.page >= (get("documents", state.viewer.doc)?.total || 1);
  }
  new MutationObserver(polishSemantics).observe($("#workspace"), {
    childList: true,
    subtree: true,
  });
  window.addEventListener("hashchange", () => {
    readRoute();
    closeDrawer();
    closeModal();
    render(true);
  });
  window.addEventListener("offline", () =>
    toast("网络已断开，当前本地数据仍可访问。", "warning"),
  );
  window.addEventListener("online", () => toast("网络连接已恢复。"));
  window.addEventListener("resize", () => {
    polishSemantics();
    if (innerWidth >= 1200) $("#app").classList.remove("sessions-open");
    if (innerWidth >= 768) $("#app").classList.remove("nav-open");
  });
  readRoute();
  if (!location.hash) history.replaceState(null, "", "#" + state.route);
  if (innerWidth < 768) state.viewer.open = false;
  render();
  save();
})();

</script>
  </body>
</html>
